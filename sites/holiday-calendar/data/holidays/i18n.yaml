# 行事曆頁面的多語言名稱（英文、繁中寫在各國資料檔；這裡補日文 ja、義大利文 it、阿拉伯文 ar）
# 規則：頁面語言 = 該國語言時，直接用資料檔的 local（當地原名），不會用到這裡。
# 例如日文頁的日本假日顯示「昭和の日」、義大利文頁的義大利假日顯示「Ferragosto」。
countries:
  us: {ja: アメリカ, it: Stati Uniti, ar: الولايات المتحدة}
  ae: {ja: アラブ首長国連邦, it: Emirati Arabi Uniti, ar: الإمارات}
  it: {ja: イタリア, it: Italia, ar: إيطاليا}
  jp: {ja: 日本, it: Giappone, ar: اليابان}
  de: {ja: ドイツ, it: Germania, ar: ألمانيا}
  fr: {ja: フランス, it: Francia, ar: فرنسا}
  gb: {ja: イギリス, it: Regno Unito, ar: المملكة المتحدة}
  au: {ja: オーストラリア, it: Australia, ar: أستراليا}
  tw: {ja: 台湾, it: Taiwan, ar: تايوان}

