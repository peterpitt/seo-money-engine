# 澳洲公眾假日：以新南威爾斯州（NSW，雪梨）為準。各州不同，例如國王誕辰昆士蘭在 10 月、西澳在 9 月。
# 元旦、聖誕節、節禮日落在週末時補假：date 是實際放假日，actual 是原本的日期。
# 澳紐軍團紀念日固定在 4/25，落在週末時 NSW 另加週一（additional day）。
# 不列 8 月的 Bank Holiday：NSW 政府說明那只是銀行休息，不是公眾假日。
# 2028–2029：NSW 網站尚未列出，依 Public Holidays Act 2010 的規則推算。
# 查核：nsw.gov.au/about-nsw/public-holidays、python-holidays 0.107（subdiv=NSW）交叉比對（2026-10-26）
