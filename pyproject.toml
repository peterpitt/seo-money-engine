[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-money-engine"
version = "0.1.0"
description = "雙軌（USD/TWD）SEO 變現系統：關鍵字評估 → 品質閘門 → 靜態網站 → 聯盟/AdSense → 成效報告"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "markdown>=3.5",
  "tzdata>=2024.1",   # Windows 沒有內建 IANA 時區資料，行事曆的當地時間需要它
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-bdd>=8", "pytest-cov>=5"]
google = ["google-ads>=34", "google-auth-oauthlib>=1.2"]

[project.scripts]
seoengine = "seoengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seoengine = ["templates/*", "scaffold/**/*", "scaffold/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
